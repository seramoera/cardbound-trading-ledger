name: Deploy client to GitHub Pages

# Builds the React client and publishes it to GitHub Pages on every push to
# main, so the link in your README is always your latest commit.
#
# TURN PAGES ON ONCE, BY HAND, or this runs green and publishes nothing:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# CONFIG. These Supabase settings are compiled into public client JavaScript.
# The anon key is designed to be public; protect data with Supabase RLS. Never
# use the Supabase service-role key here.
#
#   Settings > Secrets and variables > Actions > Variables
#     VITE_SUPABASE_URL          https://your-project-ref.supabase.co
#     VITE_SUPABASE_ANON_KEY     your public anon key

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A fresh copy of the template already has a client, but you may well
      # restructure. Skip quietly rather than failing, so your repository is not
      # red before you have written anything.
      - id: check
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -f client/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No client/package.json, so there is nothing to build yet."
          fi
          # GitHub Pages only publishes PUBLIC repositories on a free account.
          # Say so loudly rather than failing later with a confusing 404.
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::This repository is private, so GitHub Pages cannot publish it and the deploy step will be skipped. Make it public (Settings > General > Danger Zone > Change visibility) to get your live link."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - if: steps.check.outputs.ready == 'true'
        working-directory: client
        run: npm ci

      - name: Build
        if: steps.check.outputs.ready == 'true'
        working-directory: client
        env:
          # On a project page the site is served from username.github.io/<repo>/,
          # so assets need that prefix or every one of them 404s and you get a
          # blank white page. Reading the name from the event means this keeps
          # working if you rename the repository.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # npm run build also copies index.html to 404.html. GitHub Pages serves
        # 404.html for any path it cannot find, which is how a single-page app
        # survives someone refreshing on a nested route.
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in repository Actions variables before deploying."
            exit 1
          fi
          npm run build

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: client/dist

  deploy:
    needs: build
    # Skipped, not failed, when there is nothing to build or the repo is private.
    if: needs.build.outputs.ready == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
